<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131d2b">
  <title>Lingua Pages — Learn Chinese Through Stories</title>
  <style>
    :root{--ink:#49364f;--muted:#816f86;--paper:#fff9fc;--card:#fff;--gold:#e7aa37;--red:#dc6e91;--jade:#47a78d;--navy:#6e4c75;--line:#efdce8;--pink:#f7b8cf;--lilac:#d9c7f2;--shadow:0 18px 50px rgba(101,66,98,.15)}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 12% 8%,#ffe4ef 0 12%,transparent 35%),radial-gradient(circle at 90% 18%,#e9dcff 0 10%,transparent 32%),linear-gradient(145deg,#fff5f9,#f7f0ff);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button{font:inherit}
    .shell{width:min(960px,calc(100% - 28px));margin:22px auto 56px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(125deg,#79547f,#a46b91);color:white;padding:16px 20px;border-radius:22px 22px 8px 8px}
    .brand{font-family:Georgia,serif;font-size:22px;letter-spacing:.02em}.brand span{color:#ffe19d}.home-btn{display:none;background:rgba(255,255,255,.16);color:white;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:9px 12px;cursor:pointer}.header-spacer{display:flex;align-items:center;gap:12px}
    .progress-label{font-size:13px;color:#c9d1de;text-align:right}.progress-track{width:150px;height:7px;background:#354154;border-radius:99px;margin-top:7px;overflow:hidden}.progress-bar{height:100%;background:#efbd53;transition:width .45s ease}
    main{background:rgba(255,249,252,.94);padding:clamp(20px,4vw,42px);border-radius:8px 8px 22px 22px;box-shadow:var(--shadow)}
    .home-hero{text-align:center;padding:18px 10px 28px}.sparkles{font-size:24px;letter-spacing:10px}.home-hero h1{max-width:660px;margin:12px auto 14px}.home-hero p{max-width:590px;margin:auto;color:var(--muted);font-size:17px;line-height:1.65}.hero-badge{display:inline-flex;align-items:center;gap:8px;background:#fff0f6;color:#a34f73;border:1px solid #f5c9db;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:800}
    .mascot-stage{display:flex;justify-content:center;align-items:center;margin:18px 0 6px}.mascot{width:76px;height:76px;display:grid;place-items:center;background:linear-gradient(145deg,#f6edf3,#e8deef);border:1px solid white;border-radius:22px;font-size:38px;box-shadow:0 10px 24px rgba(66,45,64,.12)}.mascot.small{width:52px;height:52px;font-size:27px;border-radius:15px}.guide-bubble{display:flex;align-items:center;gap:13px;background:#f7f3f6;border:1px solid #e7dfe5;border-radius:15px;padding:13px 16px;margin-bottom:20px}.guide-bubble .mascot{flex:0 0 52px}.guide-bubble p{margin:0;color:var(--muted);line-height:1.45}.guide-bubble strong{display:block;color:var(--ink)}.context-card{display:none;background:#f7f3f6;border-left:3px solid var(--navy);border-radius:8px;padding:13px 15px;margin-top:14px;text-align:left}.context-card.show{display:block}.context-card strong{display:block;color:var(--ink);font-size:18px}.feedback-meter{height:7px;background:#eadfe6;border-radius:99px;margin:10px 0;overflow:hidden}.feedback-meter span{display:block;height:100%;background:var(--jade);border-radius:99px}
    .home-progress{background:white;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 auto 28px;max-width:680px;display:flex;align-items:center;gap:14px}.home-progress .flower{font-size:30px}.home-progress-copy{flex:1}.home-progress-copy strong{display:block}.home-progress-copy span{font-size:13px;color:var(--muted)}.home-progress-track{height:9px;background:#f3e8ef;border-radius:99px;margin-top:8px;overflow:hidden}.home-progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),#bd91df);border-radius:99px}
    .home-stats{display:flex;justify-content:center;gap:10px;margin:-8px 0 24px}.home-stat{background:white;border:1px solid var(--line);border-radius:13px;padding:10px 15px;font-weight:850;box-shadow:0 5px 14px rgba(118,80,111,.07)}.home-stat span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
    .mission-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.mission-heading h2{margin:0;font:700 25px Georgia,serif}.mission-heading span{font-size:13px;color:var(--muted)}
    .mission-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mission-card{position:relative;background:white;border:1px solid var(--line);border-radius:18px;padding:20px;min-height:230px;display:flex;flex-direction:column;box-shadow:0 9px 24px rgba(118,80,111,.08)}.mission-card.locked{filter:grayscale(.25);opacity:.67}.mission-number{font-size:12px;font-weight:850;color:var(--red);letter-spacing:.12em;text-transform:uppercase}.mission-icon{font-size:38px;margin:15px 0 10px}.mission-card h3{font:700 20px Georgia,serif;margin:0 0 8px}.mission-card p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 18px}.mission-status{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.stars{color:#edae36;letter-spacing:2px}.mission-start{border:0;background:#f3d4e2;color:#864766;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.mission-start:disabled{background:#eee8ec;color:#9c9199;cursor:not-allowed}.daily-note{text-align:center;color:var(--muted);font-size:13px;margin:24px 0 0}
    .path-picker{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 auto 28px;max-width:680px}.path-card{border:1px solid var(--line);background:white;border-radius:18px;padding:18px;text-align:left;cursor:pointer;color:var(--ink);box-shadow:0 8px 22px rgba(118,80,111,.07)}.path-card strong{display:block;font:700 20px Georgia,serif;margin:7px 0 4px}.path-card span{color:var(--muted);font-size:13px}.path-card.comic{background:linear-gradient(145deg,#fff4f8,#f4edff)}
    .section-back{border:0;background:#f4dfeb;color:#7e4967;border-radius:99px;padding:10px 14px;font-weight:800;cursor:pointer;margin-bottom:18px}.comic-library-head{text-align:center}.comic-library-head h1{margin-bottom:10px}.comic-library-head p{color:var(--muted);margin:0 auto 28px;max-width:560px;line-height:1.6}.comic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.comic-cover{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}.comic-cover.locked{opacity:.58}.cover-art{height:120px;display:grid;place-items:center;font-size:52px;background:linear-gradient(145deg,#ffe5ef,#eee3ff);border-radius:14px;margin-bottom:16px}.comic-cover h3{font:700 20px Georgia,serif;margin:0 0 7px}.comic-cover p{font-size:13px;color:var(--muted);margin:0 0 16px}.comic-open{width:100%;border:0;border-radius:10px;padding:11px;background:#9a6597;color:white;font-weight:800;cursor:pointer}.comic-open:disabled{background:#ddd4da;color:#8f858c}.comic-reader{max-width:660px;margin:auto}.comic-top{text-align:center}.comic-count{color:var(--red);font-weight:850;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.comic-panel{margin-top:20px;background:white;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.comic-scene{height:210px;display:grid;place-items:center;background:linear-gradient(160deg,#ffe8f1,#ede6ff);border-radius:17px;font-size:60px;letter-spacing:8px;overflow:hidden}.speech-bubble{position:relative;background:white;border:2px solid #8d648e;border-radius:20px;padding:18px;margin:-20px 20px 0;text-align:center;font-size:28px;font-weight:800;box-shadow:0 8px 20px rgba(83,53,83,.12)}.comic-help{text-align:center;color:var(--muted);margin:12px 0}.comic-help strong{display:block;color:var(--red);font-size:17px}.comic-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.comic-actions .btn{background:#f3dce8;color:#75435f}.comic-actions .next-panel{background:var(--jade);color:white}.comic-dots{text-align:center;color:#c395b2;letter-spacing:5px;margin-top:16px}.badge-pop{text-align:center;padding:35px 10px}.badge-pop .big-badge{font-size:64px}.badge-pop h2{font:700 32px Georgia,serif;margin:10px}.badge-pop p{color:var(--muted)}
    .lab-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.lab-tab{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;font-weight:800;color:var(--ink);cursor:pointer}.word-bank{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.vocab-card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.vocab-word{font-size:28px;font-weight:800}.vocab-pinyin{color:var(--red);font-weight:700}.vocab-meaning{color:var(--muted);margin:3px 0 12px}.vocab-card button{border:0;background:#f1e8f0;color:var(--navy);border-radius:9px;padding:8px 10px;cursor:pointer}.sentence-workspace{max-width:680px;margin:auto;background:white;border:1px solid var(--line);border-radius:20px;padding:24px}.sentence-prompt{text-align:center;color:var(--muted);margin-bottom:18px}.sentence-answer{min-height:68px;border:2px dashed #d8c7d2;border-radius:13px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.word-tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.word-tile{border:1px solid #d8c7d2;background:white;border-radius:10px;padding:11px 15px;font-size:18px;box-shadow:0 3px 0 #e5dbe1;cursor:pointer}.word-tile.answer-tile{background:#eee7f1}.sentence-controls{display:flex;gap:10px;justify-content:center;margin-top:20px}.empty-state{text-align:center;padding:42px 20px;color:var(--muted)}
    .tone-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:12px 0 2px}.tone-cell{text-align:center}.tone-char{display:block;font-size:21px;font-weight:800}.tone-svg{display:block;margin:4px auto 0}.tone-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}.tone-hint{font-size:12px;color:var(--muted);margin:8px 0 0}.tone-hint strong{color:var(--ink)}.syllable-chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0 0}.syllable-chip{border:1px solid #d8c7d2;background:white;border-radius:99px;padding:8px 13px;font-size:15px;cursor:pointer}.syllable-chip:hover{background:#f3e8f0}.compare{grid-column:1/-1;background:#fdeee0;color:#8a5a22}.beat-dots{text-align:center;color:#c395b2;letter-spacing:5px;margin:14px 0 0}.scene-card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;max-width:620px;margin:18px auto 0}.scene-ask{font:700 21px Georgia,serif;margin:0 0 16px}.feedback.close{background:#fff7e6;color:#8a6420}
    .avatar{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;color:white;font:800 34px Georgia,serif;box-shadow:0 10px 24px rgba(66,45,64,.12);border:1px solid rgba(255,255,255,.35)}.avatar.small{width:52px;height:52px;border-radius:15px;font-size:25px;flex:0 0 52px}
    .privacy-note{margin:26px auto 0;max-width:640px;text-align:center;font-size:12px;line-height:1.6;color:var(--muted);background:#f7f3f6;border:1px solid #e7dfe5;border-radius:13px;padding:13px 16px}
    .backup-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px auto 0;max-width:560px}
    h1:focus{outline:none}
    button:focus-visible{outline:3px solid #4d90fe;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
    .eyebrow{margin:0 0 8px;color:var(--red);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0 0 22px;font:700 clamp(30px,5vw,48px)/1.06 Georgia,serif}
    .story{font:18px/1.85 Georgia,serif;color:#354055;border-left:3px solid var(--gold);padding:4px 0 4px 22px;max-width:780px}
    .story p{margin:0}.story .mystery{margin-top:14px;color:#8b4b36;font-style:italic}
    .lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.72fr);gap:22px;margin-top:30px}
    .word-card,.coach-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
    .word-card{text-align:center;background:radial-gradient(circle at 50% 25%,#fff,#fff8e9)}
    .word-label,.coach-title{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
    .hanzi{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:64px;line-height:1.15;margin:14px 0 4px;color:#1d2d3f}
    .pinyin{font-size:21px;color:var(--red);font-weight:700}.meaning{color:var(--muted);margin-top:6px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
    .btn{border:0;border-radius:11px;padding:13px 15px;font-weight:750;cursor:pointer;transition:transform .15s,filter .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .speak{background:#eee7ff;color:#543d86}.record{background:var(--red);color:white}.record.active{animation:pulse 1.2s infinite;background:#a72c27}.playback{grid-column:1/-1;background:#e4f1ed;color:#176b56}
    @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(207,75,63,.15)}}
    .coach-card{display:flex;flex-direction:column}.coach-title{margin-bottom:13px}.tip{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 16px}.tip strong{color:var(--ink)}
    .feedback{flex:1;min-height:116px;border-radius:12px;background:#f5f3ed;padding:15px;line-height:1.5;color:#525d70}.feedback.listening{background:#fff1ee;color:#873930}.feedback.success{background:#e7f4ee;color:#14634e}.feedback.error{background:#fff0ee;color:#873930}
    .feedback strong{display:block;color:inherit;margin-bottom:5px}.recognized{margin-top:8px;font-size:13px;opacity:.82}
    .continue{width:100%;margin-top:14px;background:var(--jade);color:white;display:none}.continue.show{display:flex}
    .browser-note{margin:22px 0 0;font-size:12px;color:var(--muted);text-align:center}
    .complete{text-align:center;padding:38px 10px}.complete .seal{font-size:58px}.complete h2{font:700 34px Georgia,serif;margin:12px}.complete p{color:var(--muted);line-height:1.7}.restart{margin:20px auto 0;background:var(--navy);color:white}
    @media(max-width:720px){body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.shell{width:min(100% - 16px,620px);margin:8px auto 30px}header{position:sticky;top:0;z-index:5;border-radius:18px 18px 7px 7px}.brand{font-size:19px}main{padding:22px 16px}.lesson{grid-template-columns:1fr}.hanzi{font-size:54px}.story{font-size:17px;padding-left:16px}.progress-track{width:80px}.actions{grid-template-columns:1fr}.playback,.compare{grid-column:auto}.mission-grid,.comic-grid,.word-bank{grid-template-columns:1fr}.mission-card{min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:14px}.mission-icon{grid-row:1/4;margin:4px 0}.mission-number,.mission-card h3,.mission-card p,.mission-status{grid-column:2}.home-progress{align-items:flex-start}.home-hero{padding-top:8px}.home-hero h1{font-size:36px}.home-btn{min-width:44px;min-height:44px}.path-picker,.lab-tabs{grid-template-columns:1fr}.comic-scene{height:180px;font-size:44px}.speech-bubble{font-size:23px;margin:-16px 10px 0}.comic-actions{grid-template-columns:1fr}.mascot{width:60px;height:60px;font-size:30px}.sentence-controls{flex-direction:column}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="header-spacer"><button class="home-btn" id="homeBtn" type="button">⌂ Home</button><div class="brand">Lingua <span>Pages</span></div></div>
      <div class="progress-label" id="headerProgress"><span id="progressText">Chapter 1 of 6</span><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div>
    </header>
    <main id="app"></main>
  </div>

  <script src="data.js"></script>
  <script>
    let activeTrackId = localStorage.getItem("linguaActiveTrack") || "mystery"
    let chapters = storyTracks.find(track=>track.id===activeTrackId)?.lessons || mysteryChapters

    let chapterIndex = Number(localStorage.getItem("linguaChapter") || 0)
    if(chapterIndex < 0 || chapterIndex >= chapters.length) chapterIndex = 0
    let lessonPhase = localStorage.getItem("linguaLessonPhase")
    if(!["story","meaning","practice"].includes(lessonPhase)) lessonPhase = "story"
    let beatIndex = Math.max(0, Number(localStorage.getItem("linguaBeatIndex") || 0))
    let trackProgress = {}
    try{ trackProgress=JSON.parse(localStorage.getItem("linguaTrackProgress")||"{}") }catch(error){ trackProgress={} }
    if(!Object.keys(trackProgress).length) trackProgress.mystery=Number(localStorage.getItem("linguaCompleted")||0)
    let completedMissions = Number(trackProgress[activeTrackId] || 0)
    if(completedMissions < 0 || completedMissions > chapters.length) completedMissions = 0
    let completedComics = Number(localStorage.getItem("linguaComicsCompleted") || 0)
    if(completedComics < 0 || completedComics > comics.length) completedComics = 0
    let comicIndex = 0
    let panelIndex = 0
    let recognition = null
    let mediaRecorder = null
    let mediaStream = null
    let audioChunks = []
    let recordingUrl = ""
    let recognitionFinished = false
    let pronunciationAttempts = 0
    let recordingTimeout = null
    let recordingSession = 0
    let lastUtterance = null
    let reviewSchedule = {}
    try{reviewSchedule=JSON.parse(localStorage.getItem("linguaReviewSchedule")||"{}")}catch(error){reviewSchedule={}}
    let reviewItems=[]
    let reviewIndex=0
    let reviewScore=0
    let reviewMistakes=0
    let reviewFirstTry=true
    let reviewIsDaily=false
    let reviewSession=null
    try{reviewSession=JSON.parse(localStorage.getItem("linguaReviewSession")||"null")}catch(error){reviewSession=null}
    let sentenceItems=[]
    let sentenceIndex=0
    let sentenceBuilt=[]
    let sentenceRemaining=[]
    let sentenceRecognition=null

    const toneMarkTone={"ā":1,"á":2,"ǎ":3,"à":4,"ē":1,"é":2,"ě":3,"è":4,"ī":1,"í":2,"ǐ":3,"ì":4,"ō":1,"ó":2,"ǒ":3,"ò":4,"ū":1,"ú":2,"ǔ":3,"ù":4,"ǖ":1,"ǘ":2,"ǚ":3,"ǜ":4}
    const toneBase={"ā":"a","á":"a","ǎ":"a","à":"a","ē":"e","é":"e","ě":"e","è":"e","ī":"i","í":"i","ǐ":"i","ì":"i","ō":"o","ó":"o","ǒ":"o","ò":"o","ū":"u","ú":"u","ǔ":"u","ù":"u","ǖ":"u","ǘ":"u","ǚ":"u","ǜ":"u","ü":"u"}
    const toneColor={0:"#9aa3ad",1:"#e7aa37",2:"#47a78d",3:"#7a6fd0",4:"#dc6e91"}
    const toneLabel={0:"neutral",1:"1st",2:"2nd",3:"3rd",4:"4th"}
    const toneContours={0:[3,3,3,2],1:[5,5,5,5],2:[3,4,5,5],3:[2,1,3,4],4:[5,4,2,1]}
    const toneLegend="Tones: <strong>1st</strong> high &amp; level · <strong>2nd</strong> rising · <strong>3rd</strong> dips · <strong>4th</strong> falls"
    const charPinyin={}
    function learnCharPinyin(word,pinyin){ const chars=Array.from(String(word||"")); const syl=String(pinyin||"").split(/\s+/); if(chars.length!==syl.length) return; chars.forEach((c,i)=>{ if(c&&!charPinyin[c]) charPinyin[c]=syl[i] }) }
    function buildCharPinyin(){ allLessonRecords().forEach(record=>learnCharPinyin(record.lesson.word,record.lesson.pinyin)) }
    function toneOf(syllable){ const match=String(syllable||"").match(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/); return match?toneMarkTone[match[0]]:0 }
    function stripTones(py){ return String(py||"").replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g,c=>toneBase[c]) }
    function pinyinOf(text){ return Array.from(String(text||"")).map(c=>charPinyin[c]||"").filter(Boolean).map(stripTones).join("") }
    function syllablesOf(word,pinyin){ const chars=Array.from(String(word||"")); const syl=String(pinyin||"").split(/\s+/); return chars.map((c,i)=>({char:c,syllable:syl[i]||"",tone:toneOf(syl[i]||"")})) }
    function toneRowHTML(word,pinyin){
      const items=syllablesOf(word,pinyin)
      return `<div class="tone-row">${items.map(item=>{
        const pts=toneContours[item.tone].map((v,i)=>`${(10+i*16).toFixed(1)},${(30-(v*26/5)).toFixed(1)}`).join(" ")
        return `<div class="tone-cell"><span class="tone-char" lang="zh-CN">${item.char}</span><svg class="tone-svg" width="70" height="34" viewBox="0 0 70 34" aria-hidden="true"><line x1="8" y1="29" x2="62" y2="29" stroke="#e4d6e0" stroke-width="1.5"/><polyline points="${pts}" fill="none" stroke="${toneColor[item.tone]}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tone-label">${toneLabel[item.tone]}</span></div>`
      }).join("")}</div><p class="tone-hint">${toneLegend}</p>`
    }

    function chapterBeats(chapter){ return chapter.beats && chapter.beats.length ? chapter.beats : splitStory(chapter.story) }
    function splitStory(story){ return String(story||"").split(/(?<=[.?!])\s+/).filter(Boolean) }

    const trackAvatarColors={mystery:"linear-gradient(145deg,#7a5aa8,#4d3a6e)",cafe:"linear-gradient(145deg,#e28f6a,#a3554f)",school:"linear-gradient(145deg,#4f86c6,#2f4f7a)",postcards:"linear-gradient(145deg,#3f9d7e,#24614f)",city:"linear-gradient(145deg,#d8a23d,#8f6a22)"}
    function guideAvatar(guide,color,small){
      return `<div class="avatar${small?" small":""}" style="background:${color||trackAvatarColors.mystery}" aria-hidden="true">${escapeHtml((guide.name||"?").charAt(0).toUpperCase())}</div>`
    }

    function renderHome(){
      cleanupAudio()
      document.getElementById("homeBtn").style.display = "none"
      document.getElementById("headerProgress").style.display = "none"

    function downloadBackup(){
      const data={}
      for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf("lingua")===0)data[key]=localStorage.getItem(key)}
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"})
      const url=URL.createObjectURL(blob)
      const link=document.createElement("a");link.href=url;link.download="lingua-pages-backup.json";document.body.appendChild(link);link.click();link.remove()
      window.setTimeout(()=>URL.revokeObjectURL(url),1000)
    }
    function restoreBackup(file){
      const reader=new FileReader()
      reader.onload=()=>{try{
        const data=JSON.parse(reader.result)
        Object.keys(data).forEach(key=>{if(key.indexOf("lingua")===0)localStorage.setItem(key,data[key])})
        location.reload()
      }catch(error){
        window.alert("That file could not be read as a Lingua Pages backup.")
      }}
      reader.readAsText(file)
    }

    function renderWordBank(){
      const learned=learnedRecords()

      content.innerHTML=`<section class="word-bank">${learned.map((item,index)=>`<article class="vocab-card"><div class="vocab-word" lang="zh-CN">${item.lesson.word}</div><div class="vocab-pinyin">${item.lesson.pinyin}</div><div class="vocab-meaning">${item.lesson.meaning}</div><button data-word-index="${index}">🔊 Listen</button></article>`).join("")}</section>`

    function startSentenceGame(){
      const learnedWords=new Set(learnedRecords().map(item=>item.lesson.word))
      sentenceItems=sentencePractice.filter(item=>learnedWords.has(item.word))
      if(!sentenceItems.length) sentenceItems=sentencePractice.slice(0,3)
      sentenceIndex=0
      prepareSentenceRound()
    }

    function prepareSentenceRound(){
      const item=sentenceItems[sentenceIndex]
      sentenceBuilt=[]
      sentenceRemaining=[...item.parts].sort(()=>Math.random()-.5)
      renderSentenceRound()
    }

    function renderSentenceRound(){
      const item=sentenceItems[sentenceIndex]
      const content=document.getElementById("labContent")||document.getElementById("app")
      content.innerHTML=`<div class="sentence-workspace"><p class="eyebrow">Sentence ${sentenceIndex+1} of ${sentenceItems.length}</p><h2>Build the sentence</h2><p class="sentence-prompt">${item.en}</p><div class="sentence-answer" id="sentenceAnswer">${sentenceBuilt.map((part,index)=>`<button class="word-tile answer-tile" data-built="${index}">${part}</button>`).join("")}</div><div class="word-tiles">${sentenceRemaining.map((part,index)=>`<button class="word-tile" data-remaining="${index}">${part}</button>`).join("")}</div><div class="feedback" id="feedback" role="status" aria-live="polite"><strong>Arrange the words</strong>Tap a tile above to move it back.</div><div class="sentence-controls"><button class="btn speak" id="sentenceHear">🔊 Hear sentence</button><button class="btn record" id="sentenceSay" disabled>🎙 Say sentence</button><button class="btn continue show" id="sentenceCheck">Check</button></div></div>`
      content.querySelectorAll("[data-remaining]").forEach(button=>button.addEventListener("click",()=>{sentenceBuilt.push(sentenceRemaining.splice(Number(button.dataset.remaining),1)[0]);renderSentenceRound()}))
      content.querySelectorAll("[data-built]").forEach(button=>button.addEventListener("click",()=>{sentenceRemaining.push(sentenceBuilt.splice(Number(button.dataset.built),1)[0]);renderSentenceRound()}))
      document.getElementById("sentenceHear").addEventListener("click",()=>speakText(item.text,.75))
      document.getElementById("sentenceCheck").addEventListener("click",()=>checkSentence(item))
      focusHeading()
    }

    function checkSentence(item){
      if(sentenceBuilt.join("")===item.parts.join("")){
        showFeedback("success","Sentence complete",`<strong lang="zh-CN">${item.text}</strong> Now listen and say the complete line.`)
        document.getElementById("sentenceSay").disabled=false
        document.getElementById("sentenceSay").addEventListener("click",()=>practiceSentenceSpeech(item.text))
        const check=document.getElementById("sentenceCheck");const next=check.cloneNode(true);next.textContent=sentenceIndex<sentenceItems.length-1?"Next sentence →":"Finish practice";check.replaceWith(next);next.addEventListener("click",()=>{if(sentenceIndex<sentenceItems.length-1){sentenceIndex++;prepareSentenceRound()}else renderVocabularyLab()})
      }else showFeedback("error","Check the order","Use the English prompt and try moving the tiles.")
    }

    function practiceSentenceSpeech(target){
      const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition
      if(!Recognition){showFeedback("error","Speech check unavailable","Play the sentence, record it with your phone, and compare the rhythm.");return}
      sentenceRecognition=new Recognition();sentenceRecognition.lang="zh-CN";sentenceRecognition.maxAlternatives=5
      showFeedback("listening","Listening","Say the complete sentence.")
      sentenceRecognition.onresult=event=>{const heard=Array.from(event.results[0]).map(item=>item.transcript);const targetClean=normalizeChinese(target);const matched=heard.some(text=>{const clean=normalizeChinese(text);return clean===targetClean||clean.includes(targetClean)});showFeedback(matched?"success":"error",matched?"Complete sentence matched":"Try the full sentence again",`Target: ${target}<div class="recognized">Heard as: ${escapeHtml(heard[0]||"")}</div>`)}
      sentenceRecognition.onerror=()=>showFeedback("error","No clear match","Move closer to the microphone and try once more.")
      sentenceRecognition.start()
    }

            ${toneRowHTML(chapter.word,chapter.pinyin)}
            <div class="meaning">${chapter.meaning}</div>
            <div class="syllable-chips">${syllablesOf(chapter.word,chapter.pinyin).map((item,index)=>`<button class="syllable-chip" data-syl="${index}" lang="zh-CN">${item.char} · ${item.syllable}</button>`).join("")}</div>
            <div class="actions">
              <button class="btn speak" id="speakBtn" type="button">🔊 Hear it</button>
              <button class="btn speak" id="slowBtn" type="button">½× Hear slowly</button>
              <button class="btn record" id="recordBtn" type="button">🎙 Record me</button>
              <button class="btn playback" id="playbackBtn" type="button" disabled>▶ My recording</button>
              <button class="btn compare" id="compareBtn" type="button" disabled>🔁 Model → Mine</button>
              <button class="btn playback" id="contextBtn" type="button">Context phrase</button>
            </div>
            <div class="context-card" id="contextCard"><strong lang="zh-CN">${lessonExamples[chapter.word]||chapter.word}</strong><button class="btn speak" id="contextSpeak" type="button" style="margin-top:10px">🔊 Hear phrase</button></div>
          </div>
          <div class="coach-card">
            <div class="coach-title">Pronunciation coach</div><p class="tip">${chapter.tip}</p>
            <div class="feedback" id="feedback" role="status" aria-live="polite"><strong>Ready when you are</strong>Listen first, then record yourself. Your browser checks what it transcribed — a transcription check, not a pronunciation grade.</div>
            <button class="btn continue" id="continueBtn" type="button">Continue the story →</button>
          </div>
        </section>
        <p class="browser-note">For best results, use Chrome or Edge on an HTTPS page and allow microphone access. Recordings are processed on this device, checked by your browser’s speech service, and discarded when you leave the page.</p>`
      document.getElementById("speakBtn").addEventListener("click", speakWord)
      document.getElementById("slowBtn").addEventListener("click",()=>speakText(chapter.word,.52))
      document.getElementById("recordBtn").addEventListener("click", toggleRecording)
      document.getElementById("playbackBtn").addEventListener("click", playRecording)
      document.getElementById("compareBtn").addEventListener("click", playCompare)
      document.getElementById("contextBtn").addEventListener("click",()=>document.getElementById("contextCard").classList.toggle("show"))
      document.getElementById("contextSpeak").addEventListener("click",()=>speakText(lessonExamples[chapter.word]||chapter.word,.75))
      document.querySelectorAll(".syllable-chip").forEach(button=>button.addEventListener("click",()=>speakText(syllablesOf(chapter.word,chapter.pinyin)[Number(button.dataset.syl)].char,.72)))
      document.getElementById("continueBtn").addEventListener("click", nextChapter)
      focusHeading()
    }

    function chineseVoice(){
      const voices = speechSynthesis.getVoices()
      return voices.find(v => /^zh[-_]CN$/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang)) || null
    }

    function speakWord(){
      speakText(chapters[chapterIndex].word)
    }

    function speakText(text,rate=.72,onEnd=null){
      if(!("speechSynthesis" in window)) return showFeedback("error","Speech is unavailable","Please try Chrome, Edge, or Safari.")
      const utterance = new SpeechSynthesisUtterance(text)
      lastUtterance = utterance
      utterance.lang = "zh-CN"; utterance.rate = rate; utterance.pitch = 1
      const voice = chineseVoice(); if(voice) utterance.voice = voice
      if(onEnd) utterance.onend = () => { if(utterance === lastUtterance) onEnd() }
      speechSynthesis.cancel(); speechSynthesis.resume(); speechSynthesis.speak(utterance)
    }

    async function toggleRecording(){
      if(mediaRecorder?.state === "recording") return stopRecording()
      if(!navigator.mediaDevices?.getUserMedia || !("MediaRecorder" in window)){
        return showFeedback("error","Recording is unavailable","Open the published HTTPS page in a current version of Chrome or Edge.")
      }
      try{
        mediaStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})
        audioChunks = []; recognition = null; recognitionFinished = false
        const session = ++recordingSession
        mediaRecorder = new MediaRecorder(mediaStream)
        mediaRecorder.ondataavailable = event => { if(event.data.size) audioChunks.push(event.data) }
        mediaRecorder.onstop = () => { if(session === recordingSession) saveRecording() }
        mediaRecorder.start()
        startRecognition()
        const button = document.getElementById("recordBtn")
        button.classList.add("active"); button.textContent = "■ Stop recording"
        showFeedback("listening","Listening…",`Say “${chapters[chapterIndex].word}” clearly. Recording will stop automatically.`)
        recordingTimeout = window.setTimeout(() => { if(session === recordingSession && mediaRecorder?.state === "recording") stopRecording() }, 6000)
      }catch(error){
        showFeedback("error","Microphone access is needed","Allow microphone permission in the browser address bar, then try again.")
      }
    }

    function startRecognition(){
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition
      if(!Recognition){
        showFeedback("listening","Recording your voice","Automatic Chinese checking is unavailable in this browser, but you can replay and compare your recording.")
        return
      }
      recognition = new Recognition()
      recognition.lang = "zh-CN"; recognition.interimResults = false; recognition.continuous = false; recognition.maxAlternatives = 5
      recognition.onresult = event => {
        recognitionFinished = true
        const choices = Array.from(event.results[0]).map(item => ({text:item.transcript,confidence:item.confidence}))
        judgePronunciation(choices)
        if(mediaRecorder?.state === "recording") stopRecording()
      }
      recognition.onerror = event => {
        recognitionFinished = true
        if(event.error !== "aborted") showFeedback("error","We could not understand that","Move closer to the microphone, reduce background noise, and try once more.")
      }
      recognition.onnomatch = () => {
        recognitionFinished = true
        showFeedback("error","We could not match the word","Listen once more, then repeat the two syllables clearly.")
      }
      recognition.onend = () => {
        if(!recognitionFinished){
          recognitionFinished = true
          showFeedback("error","No word was detected","Try again and begin speaking just after the recording indicator appears.")
        }
      }
      try{ recognition.start() }catch(error){}
    }

    function stopRecording(){
      if(recordingTimeout){ clearTimeout(recordingTimeout); recordingTimeout=null }
      if(mediaRecorder?.state === "recording") mediaRecorder.stop()
      try{ if(recognition && !recognitionFinished) recognition.stop() }catch(error){}
      document.getElementById("recordBtn")?.classList.remove("active")
      if(document.getElementById("recordBtn")) document.getElementById("recordBtn").textContent = "🎙 Try again"
    }

    function saveRecording(){
      const type = mediaRecorder.mimeType || "audio/webm"
      if(recordingUrl) URL.revokeObjectURL(recordingUrl)
      recordingUrl = URL.createObjectURL(new Blob(audioChunks,{type}))
      const playbackButton = document.getElementById("playbackBtn")
      if(playbackButton) playbackButton.disabled = false
      const compareButton = document.getElementById("compareBtn")
      if(compareButton) compareButton.disabled = false
      mediaStream?.getTracks().forEach(track => track.stop()); mediaStream = null
      if(!recognition && !recognitionFinished){
        showFeedback("success","Practice recorded","Play your recording, compare it with the example, and repeat it if you want another try.")
        const continueButton = document.getElementById("continueBtn")
        continueButton.textContent = "I practiced it — complete mission ✓"
        continueButton.classList.add("show")
      }
    }

    function playRecording(){ if(recordingUrl) new Audio(recordingUrl).play() }
    function playCompare(){
      if(!recordingUrl) return
      speakText(chapters[chapterIndex].word,.72,()=>window.setTimeout(()=>playRecording(),220))
    }
    function normalizeChinese(value){ return String(value||"").normalize("NFKC").toLowerCase().replace(/[\s，。！？、,.!?；;：:'“”\-]/g,"").replace(/3/g,"三") }

    const recognitionAliases = {"钥匙":["要是"],"哪里":["哪儿","那里"],"三个":["三個"],"秘密":["密密"],"镜子":["鏡子"],"书店":["書店"],"花园":["花園"],"红色":["紅色"],"谢谢":["謝謝"]}

    function judgePronunciation(choices){
      const target = normalizeChinese(chapters[chapterIndex].word)
      const accepted = [target,...(recognitionAliases[chapters[chapterIndex].word]||[]).map(normalizeChinese)]
      const targetPinyin = pinyinOf(chapters[chapterIndex].word)
      const info = choices.map(choice=>({text:choice.text,clean:normalizeChinese(choice.text),py:pinyinOf(choice.text),conf:choice.confidence}))
      const exactIndex = info.findIndex(c=>accepted.some(answer=>c.clean===answer||(answer.length>1&&c.clean.includes(answer))))
      if(exactIndex > -1){
        pronunciationAttempts = 0
        const match = info[exactIndex]
        const score = match.conf > 0 ? Math.round(match.conf * 100) : null
        showFeedback("success","Transcribed as the target",`The browser transcribed your speech as <strong lang="zh-CN">${chapters[chapterIndex].word}</strong>.${score!=null?`<div class="feedback-meter"><span style="width:${score}%"></span></div>Transcription confidence: ${score}%.`:""}<div class="recognized">Heard as: ${escapeHtml(match.text)}</div>`)
        document.getElementById("continueBtn").classList.add("show")
        return
      }
      const closeIndex = info.findIndex(c=>c.clean && targetPinyin && c.py && (c.py===targetPinyin||c.py.includes(targetPinyin)||targetPinyin.includes(c.py)))
      if(closeIndex > -1){
        pronunciationAttempts++
        const canContinue = pronunciationAttempts >= 2
        showFeedback("close",canContinue?"Review and decide":"Close transcription match",`The browser heard a sound that matches <strong lang="zh-CN">${chapters[chapterIndex].word}</strong>, but not the exact characters. Play the slow example and focus on the tones.<div class="recognized">Heard as: ${escapeHtml(info[closeIndex].text||"nothing")}</div>`)
        if(canContinue){ const button=document.getElementById("continueBtn");button.textContent="Continue · review later →";button.classList.add("show");scheduleLessonReview(activeTrackId,chapterIndex) }
        return
      }
      pronunciationAttempts++
      const canContinue = pronunciationAttempts >= 2
      showFeedback("error",canContinue?"Review and decide":"Not matched yet",`${canContinue?"Compare your recording with the slow example. You can retry or continue and review this word later.":"Play the slow example, then pronounce each syllable clearly."}<div class="recognized">Target: ${chapters[chapterIndex].word} · Heard as: ${escapeHtml(info[0]?.text||"nothing")}</div>`)
      if(canContinue){ const button=document.getElementById("continueBtn");button.textContent="Continue · review later →";button.classList.add("show");scheduleLessonReview(activeTrackId,chapterIndex) }
    }

    function showFeedback(kind,title,message){
      const box = document.getElementById("feedback"); if(!box) return
      box.className = `feedback ${kind}`; box.innerHTML = `<strong>${title}</strong>${message}`
    }
    function escapeHtml(value){ const div=document.createElement("div"); div.textContent=value; return div.innerHTML }

    function allLessonRecords(){
      return storyTracks.flatMap(track=>track.lessons.map((lesson,index)=>({lesson,key:`${track.id}-${index}`,trackId:track.id,index})))
    }

    function scheduleLessonReview(trackId,index){
      const key=`${trackId}-${index}`
      const old=reviewSchedule[key]||{strength:0}
      reviewSchedule[key]={strength:old.strength,dueAt:Date.now()+86400000}
      localStorage.setItem("linguaReviewSchedule",JSON.stringify(reviewSchedule))
    }

    function getDueReviewItems(){
      const records=allLessonRecords()
      return records.filter(record=>reviewSchedule[record.key]?.dueAt<=Date.now())
    }

    function updateReviewStrength(key,correct){
      const card=reviewSchedule[key]||{strength:0,dueAt:0,reviews:0,correct:0,lastReviewedAt:0}
      card.reviews=(card.reviews||0)+1
      card.lastReviewedAt=Date.now()
      if(correct){card.correct=(card.correct||0)+1;card.strength=Math.min(card.strength+1,4)}
      else{card.strength=0}
      const days=[1,3,7,14,30][card.strength]
      card.dueAt=Date.now()+days*86400000
      reviewSchedule[key]=card
      localStorage.setItem("linguaReviewSchedule",JSON.stringify(reviewSchedule))
    }

    function addReviewCorrect(){
      localStorage.setItem("linguaReviewCorrect",String(Number(localStorage.getItem("linguaReviewCorrect")||0)+1))
    }

    function startReview(sourceLessons,isDaily=false){
      cleanupAudio()
      const records=allLessonRecords()
      reviewItems=sourceLessons.map(lesson=>{const record=records.find(item=>item.lesson===lesson)||records.find(item=>item.lesson.word===lesson.word);return record?{...record,requeued:false,missed:false}:null}).filter(Boolean)
      reviewIndex=0;reviewScore=0;reviewMistakes=0;reviewFirstTry=true;reviewIsDaily=!!isDaily
      document.getElementById("homeBtn").style.display="inline-block"
      saveReviewSession()
      renderReviewQuestion(isDaily)
    }

    function renderReviewQuestion(isDaily=false){
      if(reviewIndex>=reviewItems.length) return finishReview(isDaily)
      const item=reviewItems[reviewIndex]
      const pool=[...new Set(allLessonRecords().map(record=>record.lesson.meaning).filter(value=>value!==item.lesson.meaning))]
      const choices=[item.lesson.meaning,...pool.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)
      document.getElementById("headerProgress").style.display="block"
      document.getElementById("progressText").textContent=`Review ${reviewIndex+1} of ${reviewItems.length}`
      document.getElementById("progressBar").style.width=`${((reviewIndex+1)/reviewItems.length)*100}%`
      document.getElementById("app").innerHTML=`<button class="section-back" id="leaveReview">← Leave review</button><section class="comic-library-head"><p class="eyebrow">${isDaily?"Daily Review":"Level Checkpoint"}</p><h1>What does this word mean?</h1></section><div class="word-card" style="max-width:560px;margin:auto"><div class="hanzi" lang="zh-CN">${item.lesson.word}</div><div class="pinyin">${item.lesson.pinyin}</div><button class="btn speak" id="reviewSpeak" style="margin:14px auto">🔊 Hear it</button><div class="actions" id="reviewChoices">${choices.map(choice=>`<button class="btn playback review-choice" data-answer="${escapeHtml(choice)}">${escapeHtml(choice)}</button>`).join("")}</div><div class="feedback" id="feedback" role="status" aria-live="polite"><strong>Choose an answer</strong>Words you miss will return again before the review ends.</div></div>`
      document.getElementById("leaveReview").addEventListener("click",()=>{clearReviewSession();renderHome()})
      document.getElementById("reviewSpeak").addEventListener("click",()=>speakText(item.lesson.word))
      document.querySelectorAll(".review-choice").forEach(button=>button.addEventListener("click",()=>answerReview(button,item,isDaily)))
      focusHeading()
    }

    function answerReview(button,item,isDaily){
      if(button.dataset.answer===item.lesson.meaning){
        if(reviewFirstTry&&!item.requeued){ reviewScore++; addReviewCorrect() }
        updateReviewStrength(item.key,true)
        showFeedback("success","Correct!",`${item.lesson.word} means “${item.lesson.meaning}.”`)
        reviewIndex++;reviewFirstTry=true
        saveReviewSession()
        setTimeout(()=>renderReviewQuestion(isDaily),550)
      }else{
        reviewMistakes++;reviewFirstTry=false;item.missed=true
        updateReviewStrength(item.key,false)
        button.disabled=true
        showFeedback("error","Not quite — try again",`Listen once more and use the pinyin clue. This word will return later in the review.`)
        if(!item.requeued&&!reviewItems.some((queued,index)=>index>reviewIndex&&queued.key===item.key)) reviewItems.push({...item,requeued:true,missed:false})
        saveReviewSession()
      }
    }

    function finishReview(isDaily){
      clearReviewSession()
      document.getElementById("headerProgress").style.display="none"
      document.getElementById("app").innerHTML=`<div class="complete"><div class="seal">${reviewMistakes?"🌱":"🏆"}</div><p class="eyebrow">Review complete</p><h2>${reviewMistakes?"Mistakes make memories stronger":"Perfect review!"}</h2><p>You corrected every word${reviewMistakes?` and practiced ${reviewMistakes} extra time${reviewMistakes===1?"":"s"}`:" on the first try"}.<br>These words will return later for spaced practice.</p><button class="btn restart" id="reviewDone">${isDaily?"Back Home":"Back to this track"}</button></div>`
      document.getElementById("reviewDone").addEventListener("click",isDaily?renderHome:renderTrack)
      focusHeading()
    }

    function saveLessonState(){
      localStorage.setItem("linguaLessonPhase",lessonPhase)
      localStorage.setItem("linguaBeatIndex",String(beatIndex))
    }
    function saveReviewSession(){
      localStorage.setItem("linguaReviewSession",JSON.stringify({
        items:reviewItems.map(item=>({key:item.key,requeued:!!item.requeued,missed:!!item.missed})),
        index:reviewIndex,score:reviewScore,mistakes:reviewMistakes,firstTry:reviewFirstTry,isDaily:reviewIsDaily
      }))
    }
    function clearReviewSession(){ localStorage.removeItem("linguaReviewSession") }
    function restoreReviewSession(){
      if(!reviewSession || !Array.isArray(reviewSession.items)) return false
      const records=allLessonRecords()
      const items=reviewSession.items.map(saved=>{const record=records.find(r=>r.key===saved.key);return record?{...record,requeued:!!saved.requeued,missed:!!saved.missed}:null}).filter(Boolean)
      if(!items.length) return false
      reviewItems=items
      reviewIndex=Math.min(Number(reviewSession.index||0),items.length)
      reviewScore=Number(reviewSession.score||0)
      reviewMistakes=Number(reviewSession.mistakes||0)
      reviewFirstTry=!!reviewSession.firstTry
      reviewIsDaily=!!reviewSession.isDaily
      return true
    }

    function nextChapter(){
      cleanupAudio()
      completedMissions = Math.max(completedMissions,chapterIndex + 1)
      trackProgress[activeTrackId]=completedMissions
      localStorage.setItem("linguaTrackProgress",JSON.stringify(trackProgress))
      if(activeTrackId==="mystery") localStorage.setItem("linguaCompleted",completedMissions)
      scheduleLessonReview(activeTrackId,chapterIndex)
      if(chapterIndex < chapters.length - 1){
        chapterIndex++; lessonPhase="story"; beatIndex=0; pronunciationAttempts=0
        localStorage.setItem("linguaChapter",chapterIndex)
        saveLessonState()
        render(); window.scrollTo({top:0,behavior:"smooth"})
      } else startReview(chapters)
    }
    function cleanupAudio(){
      recordingSession++
      if(recordingTimeout){clearTimeout(recordingTimeout);recordingTimeout=null}
      try{if(mediaRecorder?.state === "recording") mediaRecorder.stop()}catch(error){}
      try{recognition?.abort()}catch(error){}
      try{sentenceRecognition?.abort()}catch(error){}
      sentenceRecognition=null
      mediaStream?.getTracks().forEach(track=>track.stop())
      mediaStream=null; mediaRecorder=null; recognition=null
      if(recordingUrl){URL.revokeObjectURL(recordingUrl);recordingUrl=""}
      if("speechSynthesis" in window) speechSynthesis.cancel()
    }
    function showCompletion(){
      localStorage.removeItem("linguaChapter"); document.getElementById("progressText").textContent="Story complete"; document.getElementById("progressBar").style.width="100%"
      document.getElementById("app").innerHTML=`<div class="complete"><div class="seal">🏮</div><p class="eyebrow">All missions complete</p><h2>You unlocked the mystery!</h2><p>You learned six Chinese words across two story levels.<br>Your next adventure is waiting at Cloud Castle.</p><button class="btn restart" id="restartBtn">Back to my missions</button></div>`
      document.getElementById("restartBtn").addEventListener("click",renderHome)
    }

    window.addEventListener("beforeunload",cleanupAudio)
    document.getElementById("homeBtn").addEventListener("click",()=>{clearReviewSession();renderHome()})
    buildCharPinyin()
    if(restoreReviewSession()){
      document.getElementById("homeBtn").style.display="inline-block"
      renderReviewQuestion(reviewIsDaily)
    }else{
      renderHome()
    }
  </script>
</body>
</html>
