<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <div class="shell">
    <header>
      <div class="header-spacer"><button class="home-btn" id="homeBtn" type="button">⌂ Home</button><div class="brand">Lingua <span>Pages</span></div></div>
      <div class="progress-label" id="headerProgress"><span id="progressText">Chapter 1 of 6</span><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div>
    </header>
    <main id="app"></main>
  </div>

  <div class="tutorial-overlay" id="tutorialOverlay" hidden></div>
  <script src="data.js"></script>
  <script>
    let activeTrackId = localStorage.getItem("linguaActiveTrack") || "mystery"
    let chapters = storyTracks.find(track=>track.id===activeTrackId)?.lessons || mysteryChapters

    let chapterIndex = Number(localStorage.getItem("linguaChapter") || 0)
    if(chapterIndex < 0 || chapterIndex >= chapters.length) chapterIndex = 0
    let lessonPhase = localStorage.getItem("linguaLessonPhase")
    if(!["story","meaning","practice"].includes(lessonPhase)) lessonPhase = "story"
    let beatIndex = Math.max(0, Number(localStorage.getItem("linguaBeatIndex") || 0))
    let trackProgress = {}
    try{ trackProgress=JSON.parse(localStorage.getItem("linguaTrackProgress")||"{}") }catch(error){ trackProgress={} }
    if(!Object.keys(trackProgress).length) trackProgress.mystery=Number(localStorage.getItem("linguaCompleted")||0)
    let completedMissions = Number(trackProgress[activeTrackId] || 0)
    if(completedMissions < 0 || completedMissions > chapters.length) completedMissions = 0
    let completedComics = Number(localStorage.getItem("linguaComicsCompleted") || 0)
    if(completedComics < 0 || completedComics > comics.length) completedComics = 0
    let comicIndex = 0
    let panelIndex = 0
    let coins = Number(localStorage.getItem("linguaCoins") || 0)
    let streak = Number(localStorage.getItem("linguaStreak") || 0)
    let streakFreezes = Number(localStorage.getItem("linguaStreakFreezes") || 0)
    let ownedShopItems = []
    try{ ownedShopItems=JSON.parse(localStorage.getItem("linguaShopItems")||"[]") }catch(error){ ownedShopItems=[] }
    let quizItems = []
    let quizIndex = 0
    let quizScore = 0
    let quizTotal = 0
    let quizFirstTry = true
    let recognition = null
    let mediaRecorder = null
    let mediaStream = null
    let audioChunks = []
    let recordingUrl = ""
    let recognitionFinished = false
    let pronunciationAttempts = 0
    let recordingTimeout = null
    let recordingSession = 0
    let lastUtterance = null
    let reviewSchedule = {}
    try{reviewSchedule=JSON.parse(localStorage.getItem("linguaReviewSchedule")||"{}")}catch(error){reviewSchedule={}}
    let reviewItems=[]
    let reviewIndex=0
    let reviewScore=0
    let reviewMistakes=0
    let reviewFirstTry=true
    let reviewIsDaily=false
    let reviewReturn="track"
    let reviewSession=null
    try{reviewSession=JSON.parse(localStorage.getItem("linguaReviewSession")||"null")}catch(error){reviewSession=null}
    let sentenceItems=[]
    let sentenceIndex=0
    let sentenceBuilt=[]
    let sentenceRemaining=[]
    let sentenceRecognition=null

    const toneMarkTone={"ā":1,"á":2,"ǎ":3,"à":4,"ē":1,"é":2,"ě":3,"è":4,"ī":1,"í":2,"ǐ":3,"ì":4,"ō":1,"ó":2,"ǒ":3,"ò":4,"ū":1,"ú":2,"ǔ":3,"ù":4,"ǖ":1,"ǘ":2,"ǚ":3,"ǜ":4}
    const toneBase={"ā":"a","á":"a","ǎ":"a","à":"a","ē":"e","é":"e","ě":"e","è":"e","ī":"i","í":"i","ǐ":"i","ì":"i","ō":"o","ó":"o","ǒ":"o","ò":"o","ū":"u","ú":"u","ǔ":"u","ù":"u","ǖ":"u","ǘ":"u","ǚ":"u","ǜ":"u","ü":"u"}
    const toneColor={0:"#9aa3ad",1:"#e7aa37",2:"#47a78d",3:"#7a6fd0",4:"#dc6e91"}
    const toneLabel={0:"neutral",1:"1st",2:"2nd",3:"3rd",4:"4th"}
    const toneContours={0:[3,3,3,2],1:[5,5,5,5],2:[3,4,5,5],3:[2,1,3,4],4:[5,4,2,1]}
    const toneLegend="Tones: <strong>1st</strong> high &amp; level · <strong>2nd</strong> rising · <strong>3rd</strong> dips · <strong>4th</strong> falls"
    const charPinyin={}
    function learnCharPinyin(word,pinyin){ const chars=Array.from(String(word||"")); const syl=String(pinyin||"").split(/\s+/); if(chars.length!==syl.length) return; chars.forEach((c,i)=>{ if(c&&!charPinyin[c]) charPinyin[c]=syl[i] }) }
    function buildCharPinyin(){ allLessonRecords().forEach(record=>learnCharPinyin(record.lesson.word,record.lesson.pinyin)) }
    function toneOf(syllable){ const match=String(syllable||"").match(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/); return match?toneMarkTone[match[0]]:0 }
    function stripTones(py){ return String(py||"").replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g,c=>toneBase[c]) }
    function pinyinOf(text){ return Array.from(String(text||"")).map(c=>charPinyin[c]||"").filter(Boolean).map(stripTones).join("") }
    function syllablesOf(word,pinyin){ const chars=Array.from(String(word||"")); const syl=String(pinyin||"").split(/\s+/); return chars.map((c,i)=>({char:c,syllable:syl[i]||"",tone:toneOf(syl[i]||"")})) }
    function toneRowHTML(word,pinyin){
      const items=syllablesOf(word,pinyin)
      return `<div class="tone-row">${items.map(item=>{
        const pts=toneContours[item.tone].map((v,i)=>`${(10+i*16).toFixed(1)},${(30-(v*26/5)).toFixed(1)}`).join(" ")
        return `<div class="tone-cell"><span class="tone-char" lang="zh-CN">${item.char}</span><svg class="tone-svg" width="70" height="34" viewBox="0 0 70 34" aria-hidden="true"><line x1="8" y1="29" x2="62" y2="29" stroke="#e4d6e0" stroke-width="1.5"/><polyline points="${pts}" fill="none" stroke="${toneColor[item.tone]}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tone-label">${toneLabel[item.tone]}</span></div>`
      }).join("")}</div><p class="tone-hint">${toneLegend}</p>`
    }

    function chapterBeats(chapter){ return chapter.beats && chapter.beats.length ? chapter.beats : splitStory(chapter.story) }
    function splitStory(story){ return String(story||"").split(/(?<=[.?!])\s+/).filter(Boolean) }

    const trackAvatarColors={mystery:"linear-gradient(145deg,#7a5aa8,#4d3a6e)",cafe:"linear-gradient(145deg,#e28f6a,#a3554f)",school:"linear-gradient(145deg,#4f86c6,#2f4f7a)",postcards:"linear-gradient(145deg,#3f9d7e,#24614f)",city:"linear-gradient(145deg,#d8a23d,#8f6a22)",festival:"linear-gradient(145deg,#c2474f,#7a2f3f)",food:"linear-gradient(145deg,#e07a3f,#a3552f)"}
    function guideAvatar(guide,color,small){
      return `<div class="avatar${small?" small":""}" style="background:${color||trackAvatarColors.mystery}" aria-hidden="true">${escapeHtml((guide.name||"?").charAt(0).toUpperCase())}</div>`
    }

    function nextUpInfo(){
      for(const track of storyTracks){
        const done=Number(trackProgress[track.id]||0)
        if(done<track.lessons.length) return {track,done}
      }
      return null
    }
    function openNextUp(){
      const nextUp=nextUpInfo(); if(!nextUp) return renderStoryTracks()
      selectTrack(nextUp.track.id)
      startMission(nextUp.done)
    }

    function renderHome(){
      cleanupAudio()
      document.getElementById("homeBtn").style.display = "none"
      document.getElementById("headerProgress").style.display = "none"
      const totalLessons=storyTracks.reduce((sum,track)=>sum+track.lessons.length,0)
      const totalDone=storyTracks.reduce((sum,track)=>sum+Number(trackProgress[track.id]||0),0)
      const percent = Math.round((totalDone / totalLessons) * 100)
      const reviewCorrect=Number(localStorage.getItem("linguaReviewCorrect")||0)
      const xp=totalDone*20+completedComics*30+Number(localStorage.getItem("linguaReviewXp")||0)
      const dueCount = getDueReviewItems().length
      const learnedCount = learnedRecords().length
      const nextUp = nextUpInfo()
      const trackCards=storyTracks.map(track=>{
        const done=Number(trackProgress[track.id]||0)
        const guide=trackGuides[track.id]
        return `<article class="comic-cover"><div class="cover-art" aria-hidden="true">${guideAvatar(guide,trackAvatarColors[track.id],false)}</div><h3>${track.title}</h3><p>${track.description}<br><strong>${done}/${track.lessons.length} complete</strong></p><button class="comic-open dash-track" data-track="${track.id}">${done?done===track.lessons.length?"Review":"Continue":"Start"}</button></article>`
      }).join("")
      const comicCards=comics.map((comic,index)=>{
        const unlocked = index <= completedComics
        const complete = index < completedComics
        return `<article class="comic-cover ${unlocked ? "" : "locked"}"><div class="cover-art ${comic.image ? "has-image" : ""}" aria-hidden="true">${unlocked ? (comic.image ? `<img src="${comic.image}" alt="Cover of ${comic.title}" loading="lazy">` : comic.cover) : "🔒"}</div><h3>${comic.title}</h3><p>${complete ? `★ ${comic.badge} badge · <span lang="zh-CN">${comic.lesson.word}</span>` : unlocked ? `${comic.panels.length} panels + a new word` : "Complete the previous comic to unlock"}</p><button class="comic-open dash-comic" data-comic="${index}" ${unlocked ? "" : "disabled"}>${complete ? "Read again" : unlocked ? "Open comic" : "Locked"}</button></article>`
      }).join("")
      document.getElementById("app").innerHTML = `
        <section class="dash-hero">
          <div>
            <p class="hero-kicker">Lingua Pages · Learn Mandarin through story</p>
            <h1>Stop memorizing Chinese.<br>Start <em>reading</em> it.</h1>
            <p class="dash-hero-sub">Every lesson is a comic you can read, tap, and speak. Real scenes from daily life carry the words into your memory — and quizzes and reviews keep them there.</p>
            <div class="hero-cta" style="justify-content:flex-start"><button class="btn btn-primary" id="heroStart" type="button">${nextUp?"Continue learning →":"📖 Start your first story"}</button><button class="btn btn-ghost" id="heroComics" type="button">🗯️ Picture comics</button></div>

    function downloadBackup(){
      const data={}
      for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf("lingua")===0)data[key]=localStorage.getItem(key)}
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"})
      const url=URL.createObjectURL(blob)
      const link=document.createElement("a");link.href=url;link.download="lingua-pages-backup.json";document.body.appendChild(link);link.click();link.remove()
      window.setTimeout(()=>URL.revokeObjectURL(url),1000)
    }
    function restoreBackup(file){
      const reader=new FileReader()
      reader.onload=()=>{try{
        const data=JSON.parse(reader.result)
        if(!data || Array.isArray(data) || typeof data!=="object" || file.size>1000000) throw new Error("Invalid backup")
        const allowed=new Set(["linguaActiveTrack","linguaChapter","linguaLessonPhase","linguaBeatIndex","linguaTrackProgress","linguaCompleted","linguaComicsCompleted","linguaReviewSchedule","linguaReviewCorrect","linguaReviewSession","linguaReviewXp","linguaCoins","linguaStreak","linguaLastDay","linguaStreakFreezes","linguaTheme","linguaShopItems"])
        Object.keys(data).forEach(key=>{if(allowed.has(key)&&typeof data[key]==="string")localStorage.setItem(key,data[key])})
        location.reload()
      }catch(error){
        window.alert("That file could not be read as a Lingua Pages backup.")
      }}
      reader.readAsText(file)
    }

    function renderWordBank(){
      const learned=learnedRecords()

    function startSentenceGame(){
      const learnedWords=new Set(learnedRecords().map(item=>item.lesson.word))
      sentenceItems=sentencePractice.filter(item=>learnedWords.has(item.word))
      if(!sentenceItems.length) return renderWordBank()
      sentenceIndex=0
      prepareSentenceRound()
    }

    function prepareSentenceRound(){
      const item=sentenceItems[sentenceIndex]
      sentenceBuilt=[]
      sentenceRemaining=[...item.parts].sort(()=>Math.random()-.5)
      renderSentenceRound()
    }

    function renderSentenceRound(){
      const item=sentenceItems[sentenceIndex]
      const content=document.getElementById("labContent")||document.getElementById("app")
      content.innerHTML=`<div class="sentence-workspace"><p class="eyebrow">Sentence ${sentenceIndex+1} of ${sentenceItems.length}</p><h2>Build the sentence</h2><p class="sentence-prompt">${item.en}</p><div class="sentence-answer" id="sentenceAnswer">${sentenceBuilt.map((part,index)=>`<button class="word-tile answer-tile" data-built="${index}">${part}</button>`).join("")}</div><div class="word-tiles">${sentenceRemaining.map((part,index)=>`<button class="word-tile" data-remaining="${index}">${part}</button>`).join("")}</div><div class="feedback" id="feedback" role="status" aria-live="polite"><strong>Arrange the words</strong>Tap a tile above to move it back.</div><div class="sentence-controls"><button class="btn speak" id="sentenceHear">🔊 Hear sentence</button><button class="btn record" id="sentenceSay" disabled>🎙 Say sentence</button><button class="btn continue show" id="sentenceCheck">Check</button></div></div>`
      content.querySelectorAll("[data-remaining]").forEach(button=>button.addEventListener("click",()=>{sentenceBuilt.push(sentenceRemaining.splice(Number(button.dataset.remaining),1)[0]);renderSentenceRound()}))
      content.querySelectorAll("[data-built]").forEach(button=>button.addEventListener("click",()=>{sentenceRemaining.push(sentenceBuilt.splice(Number(button.dataset.built),1)[0]);renderSentenceRound()}))
      document.getElementById("sentenceHear").addEventListener("click",()=>speakText(item.text,.75))
      document.getElementById("sentenceCheck").addEventListener("click",()=>checkSentence(item))

    }

    function checkSentence(item){
      if(sentenceBuilt.join("")===item.parts.join("")){
        showFeedback("success","Sentence complete",`<strong lang="zh-CN">${item.text}</strong> Now listen and say the complete line.`)
        document.getElementById("sentenceSay").disabled=false
        document.getElementById("sentenceSay").addEventListener("click",()=>practiceSentenceSpeech(item.text))
        const check=document.getElementById("sentenceCheck");const next=check.cloneNode(true);next.textContent=sentenceIndex<sentenceItems.length-1?"Next sentence →":"Finish practice";check.replaceWith(next);next.addEventListener("click",()=>{if(sentenceIndex<sentenceItems.length-1){sentenceIndex++;prepareSentenceRound()}else renderVocabularyLab()})
      }else showFeedback("error","Check the order","Use the English prompt and try moving the tiles.")

    function practiceSentenceSpeech(target){
      const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition
      if(!Recognition){showFeedback("error","Speech check unavailable","Play the sentence, record it with your phone, and compare the rhythm.");return}
      sentenceRecognition=new Recognition();sentenceRecognition.lang="zh-CN";sentenceRecognition.maxAlternatives=5
      showFeedback("listening","Listening","Say the complete sentence.")
      sentenceRecognition.onresult=event=>{const heard=Array.from(event.results[0]).map(item=>item.transcript);const targetClean=normalizeChinese(target);const matched=heard.some(text=>{const clean=normalizeChinese(text);return clean===targetClean||clean.includes(targetClean)});showFeedback(matched?"success":"error",matched?"Complete sentence matched":"Try the full sentence again",`Target: ${target}<div class="recognized">Heard as: ${escapeHtml(heard[0]||"")}</div>`)}
      sentenceRecognition.onerror=()=>showFeedback("error","No clear match","Move closer to the microphone and try once more.")
      sentenceRecognition.start()

    function todayKey(){ return new Date().toISOString().slice(0,10) }
    function updateStreak(){
      const today=todayKey()
      const last=localStorage.getItem("linguaLastDay")
      if(last===today) return
      if(last){
        const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10)
        if(last===yesterday){ streak++ }
        else if(streakFreezes>0){ streakFreezes--; localStorage.setItem("linguaStreakFreezes",streakFreezes) }
        else { streak=0 }
      }
      localStorage.setItem("linguaStreak",String(streak))
      localStorage.setItem("linguaLastDay",today)
    }
    function addCoins(amount){
      coins=Math.max(0,coins+amount)
      localStorage.setItem("linguaCoins",String(coins))
    }
    function applyTheme(key){
      const themeId=["midnight","forest"].includes(key)?key:""
      localStorage.setItem("linguaTheme",themeId)
      document.body.setAttribute("data-theme",themeId)
    }

    function startQuiz(){
      cleanupAudio()
      const records=learnedRecords()
      if(!records.length){
        document.getElementById("homeBtn").style.display="inline-block"
        document.getElementById("headerProgress").style.display="none"
        document.getElementById("app").innerHTML=`<button class="section-back" id="quizHome">← Home</button><section class="comic-library-head"><p class="eyebrow">Word Quiz</p><h1>No words to quiz yet</h1><p>Complete a story lesson or read a comic episode first, and the words you learn will appear here.</p><button class="btn restart" id="quizGoStories">Choose a story</button></section>`
        document.getElementById("quizHome").addEventListener("click",renderHome)
        document.getElementById("quizGoStories").addEventListener("click",renderStoryTracks)
        focusHeading(); return
      }
      quizItems=[...records].sort(()=>Math.random()-.5).slice(0,Math.min(12,records.length))
      quizIndex=0;quizScore=0;quizTotal=quizItems.length;quizFirstTry=true
      document.getElementById("homeBtn").style.display="inline-block"
      renderQuizQuestion()
    }

    function buildQuizQuestion(item){
      const meaning=item.lesson.meaning, word=item.lesson.word, pinyin=item.lesson.pinyin
      const all=allLessonRecords()
      const type=["meaning","reverse","listen","pinyin"][Math.floor(Math.random()*4)]
      if(type==="meaning"){
        const pool=[...new Set(all.map(r=>r.lesson.meaning).filter(m=>m&&m!==meaning))].sort(()=>Math.random()-.5).slice(0,3)
        const choices=[meaning,...pool].sort(()=>Math.random()-.5)
        return {title:"What does this word mean?",prompt:`<div class="hanzi" lang="zh-CN">${word}</div><div class="pinyin">${pinyin}</div>`,speak:true,speakText:word,choices,answer:meaning,hint:"Choose the meaning you learned in the story."}
      }
      if(type==="reverse"){
        const pool=[...new Set(all.map(r=>r.lesson.word).filter(w=>w&&w!==word))].sort(()=>Math.random()-.5).slice(0,3)
        const choices=[word,...pool].sort(()=>Math.random()-.5)
        return {title:"Which word means this?",prompt:`<div class="pinyin" style="font-size:26px">“${meaning}”</div><div class="pinyin">${pinyin}</div>`,speak:false,speakText:"",choices,answer:word,hint:"Match the meaning to the characters."}
      }
      if(type==="pinyin"){
        const pool=[...new Set(all.map(r=>r.lesson.pinyin).filter(p=>p&&p!==pinyin))].sort(()=>Math.random()-.5).slice(0,3)
        const choices=[pinyin,...pool].sort(()=>Math.random()-.5)
        return {title:"Which pinyin matches this word?",prompt:`<div class="hanzi" lang="zh-CN">${word}</div><div class="meaning" style="margin-top:6px">${meaning}</div>`,speak:true,speakText:word,choices,answer:pinyin,hint:"Say it aloud, then pick the pinyin that matches."}
      }
      const pool=[...new Set(all.map(r=>r.lesson.word).filter(w=>w&&w!==word))].sort(()=>Math.random()-.5).slice(0,3)
      const choices=[word,...pool].sort(()=>Math.random()-.5)
      return {title:"Which word did you hear?",prompt:`<div class="hanzi" style="visibility:hidden">${word}</div>`,speak:true,speakText:word,choices,answer:word,hint:"Play the audio, then choose the characters you heard."}
    }

    function renderQuizQuestion(){
      if(quizIndex>=quizItems.length) return finishQuiz()
      const item=quizItems[quizIndex]
      const q=buildQuizQuestion(item)
      document.getElementById("headerProgress").style.display="block"
      document.getElementById("progressText").textContent=`Quiz ${quizIndex+1} of ${quizTotal}`
      document.getElementById("progressBar").style.width=`${((quizIndex+1)/quizTotal)*100}%`
      document.getElementById("app").innerHTML=`<button class="section-back" id="leaveQuiz">← Leave quiz</button><section class="comic-library-head"><p class="eyebrow">Word Quiz · ${quizScore} correct</p><h1>${q.title}</h1></section><div class="word-card" style="max-width:560px;margin:auto">${q.prompt}${q.speak?`<button class="btn speak" id="quizSpeak" style="margin:12px auto">🔊 Hear it</button>`:""}<div class="actions" id="quizChoices">${q.choices.map(choice=>`<button class="btn playback quiz-choice" data-answer="${escapeHtml(choice)}">${escapeHtml(choice)}</button>`).join("")}</div><div class="feedback" id="feedback" role="status" aria-live="polite"><strong>Pick the best answer</strong>${q.hint}</div></div>`
      document.getElementById("leaveQuiz").addEventListener("click",renderHome)
      document.getElementById("quizSpeak")?.addEventListener("click",()=>speakText(q.speakText,.72))
      document.querySelectorAll(".quiz-choice").forEach(button=>button.addEventListener("click",()=>answerQuiz(button,q)))
      focusHeading()
    }

    function answerQuiz(button,q){
      if(button.dataset.answer===q.answer){
        if(quizFirstTry){ quizScore++; addCoins(5) }
        showFeedback("success","Correct!",`${q.answer} ${quizFirstTry?"+5 🪙":""}`)

        setTimeout(()=>{quizIndex++;quizFirstTry=true;renderQuizQuestion()},550)
      }else{
        quizFirstTry=false
        button.disabled=true
        showFeedback("error","Not that one","Keep trying — the answer will move you forward.")

    function finishQuiz(){

      document.getElementById("continueBtn").addEventListener("click", nextChapter)
      document.getElementById("reviewLaterBtn").addEventListener("click",nextChapter)
      focusHeading()
    }

    function chineseVoice(){
      const voices = speechSynthesis.getVoices()
      return voices.find(v => /^zh[-_]CN$/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang)) || null
    }

    function speakWord(){
      speakText(chapters[chapterIndex].word)
    }

    function speakText(text,rate=.72,onEnd=null){
      if(!("speechSynthesis" in window)) return showFeedback("error","Speech is unavailable","Please try Chrome, Edge, or Safari.")
      const utterance = new SpeechSynthesisUtterance(text)
      lastUtterance = utterance
      utterance.lang = "zh-CN"; utterance.rate = rate; utterance.pitch = 1
      const voice = chineseVoice(); if(voice) utterance.voice = voice
      if(onEnd) utterance.onend = () => { if(utterance === lastUtterance) onEnd() }
      speechSynthesis.cancel(); speechSynthesis.resume(); speechSynthesis.speak(utterance)
    }

    async function toggleRecording(){
      if(mediaRecorder?.state === "recording") return stopRecording()
      if(!navigator.mediaDevices?.getUserMedia || !("MediaRecorder" in window)){
        return showFeedback("error","Recording is unavailable","Use your device recorder for self-review, play the slow model, or choose Review later. On iPhone, Voice Memos provides a reliable fallback.")
      }
      try{
        mediaStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})
        audioChunks = []; recognition = null; recognitionFinished = false
        const session = ++recordingSession
        mediaRecorder = new MediaRecorder(mediaStream)
        mediaRecorder.ondataavailable = event => { if(event.data.size) audioChunks.push(event.data) }
        mediaRecorder.onstop = () => { if(session === recordingSession) saveRecording() }
        mediaRecorder.start()
        startRecognition()
        const button = document.getElementById("recordBtn")
        button.classList.add("active"); button.textContent = "■ Stop recording"
        showFeedback("listening","Listening…",`Say “${chapters[chapterIndex].word}” clearly. Recording will stop automatically.`)
        recordingTimeout = window.setTimeout(() => { if(session === recordingSession && mediaRecorder?.state === "recording") stopRecording() }, 6000)
      }catch(error){
        showFeedback("error","Microphone access is needed","Allow microphone access and retry, or use your device recorder for self-review and choose Review later.")
      }
    }

    function startRecognition(){
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition
      if(!Recognition){
        showFeedback("listening","Recording your voice","Automatic Chinese checking is unavailable in this browser, but you can replay and compare your recording.")
        return
      }
      recognition = new Recognition()
      recognition.lang = "zh-CN"; recognition.interimResults = false; recognition.continuous = false; recognition.maxAlternatives = 5
      recognition.onresult = event => {
        recognitionFinished = true
        const choices = Array.from(event.results[0]).map(item => ({text:item.transcript,confidence:item.confidence}))
        judgePronunciation(choices)
        if(mediaRecorder?.state === "recording") stopRecording()
      }
      recognition.onerror = event => {
        recognitionFinished = true
        if(event.error !== "aborted") registerRecognitionFailure("We could not understand that","Move closer to the microphone, reduce background noise, and try once more.")
      }
      recognition.onnomatch = () => {
        recognitionFinished = true
        registerRecognitionFailure("We could not match the word","Listen once more, then repeat each syllable clearly.")
      }
      recognition.onend = () => {
        if(!recognitionFinished){
          recognitionFinished = true
          registerRecognitionFailure("No word was detected","Try again and begin speaking just after the recording indicator appears.")
        }
      }
      try{ recognition.start() }catch(error){}
    }

    function stopRecording(){
      if(recordingTimeout){ clearTimeout(recordingTimeout); recordingTimeout=null }
      if(mediaRecorder?.state === "recording") mediaRecorder.stop()
      try{ if(recognition && !recognitionFinished) recognition.stop() }catch(error){}
      document.getElementById("recordBtn")?.classList.remove("active")
      if(document.getElementById("recordBtn")) document.getElementById("recordBtn").textContent = "🎙 Try again"
    }

    function saveRecording(){
      const type = mediaRecorder.mimeType || "audio/webm"
      if(recordingUrl) URL.revokeObjectURL(recordingUrl)
      recordingUrl = URL.createObjectURL(new Blob(audioChunks,{type}))
      const playbackButton = document.getElementById("playbackBtn")
      if(playbackButton) playbackButton.disabled = false
      const compareButton = document.getElementById("compareBtn")
      if(compareButton) compareButton.disabled = false
      mediaStream?.getTracks().forEach(track => track.stop()); mediaStream = null
      if(!recognition && !recognitionFinished){
        showFeedback("success","Practice recorded","Play your recording, compare it with the example, and repeat it if you want another try.")
        const continueButton = document.getElementById("continueBtn")
        continueButton.textContent = "I practiced it — complete mission ✓"
        continueButton.classList.add("show")
      }
    }

    function playRecording(){ if(recordingUrl) new Audio(recordingUrl).play() }
    function playCompare(){
      if(!recordingUrl) return
      speakText(chapters[chapterIndex].word,.72,()=>window.setTimeout(()=>playRecording(),220))
    }
    function registerRecognitionFailure(title,message){
      pronunciationAttempts++
      const canContinue=pronunciationAttempts>=2
      const chapter=chapters[chapterIndex]
      showFeedback("error",canContinue?"Review and decide":title,`${message}<div class="recognized">Target: <span lang="zh-CN">${chapter.word}</span> · ${chapter.pinyin}</div>${canContinue?"Automatic transcription can be unreliable. Retry, compare recordings, or continue and review later.":""}`)
      if(canContinue){const button=document.getElementById("continueBtn");if(button){button.textContent="Continue · review later →";button.classList.add("show")}scheduleLessonReview(activeTrackId,chapterIndex)}
    }
    function normalizeChinese(value){ return String(value||"").normalize("NFKC").toLowerCase().replace(/[\s，。！？、,.!?；;：:'“”\-]/g,"").replace(/3/g,"三") }

    const recognitionAliases = {"钥匙":["要是"],"哪里":["哪儿","那里"],"三个":["三個"],"秘密":["密密"],"镜子":["鏡子"],"书店":["書店"],"花园":["花園"],"红色":["紅色"],"谢谢":["謝謝"]}

    function judgePronunciation(choices){
      const target = normalizeChinese(chapters[chapterIndex].word)
      const accepted = [target,...(recognitionAliases[chapters[chapterIndex].word]||[]).map(normalizeChinese)]
      const targetPinyin = pinyinOf(chapters[chapterIndex].word)
      const info = choices.map(choice=>({text:choice.text,clean:normalizeChinese(choice.text),py:pinyinOf(choice.text),conf:choice.confidence}))
      const exactIndex = info.findIndex(c=>accepted.some(answer=>c.clean===answer||(answer.length>1&&c.clean.includes(answer))))
      if(exactIndex > -1){
        pronunciationAttempts = 0
        const match = info[exactIndex]
        const score = match.conf > 0 ? Math.round(match.conf * 100) : null
        showFeedback("success","Transcribed as the target",`The browser transcribed your speech as <strong lang="zh-CN">${chapters[chapterIndex].word}</strong>.${score!=null?`<div class="feedback-meter"><span style="width:${score}%"></span></div>Transcription confidence: ${score}%.`:""}<div class="recognized">Heard as: ${escapeHtml(match.text)}</div>`)
        document.getElementById("continueBtn").classList.add("show")
        return
      }
      const closeIndex = info.findIndex(c=>c.clean && targetPinyin && c.py && (c.py===targetPinyin||c.py.includes(targetPinyin)||targetPinyin.includes(c.py)))
      if(closeIndex > -1){
        pronunciationAttempts++
        const canContinue = pronunciationAttempts >= 2
        showFeedback("close",canContinue?"Review and decide":"Close transcription match",`The browser heard a sound that matches <strong lang="zh-CN">${chapters[chapterIndex].word}</strong>, but not the exact characters. Play the slow example and focus on the tones.<div class="recognized">Heard as: ${escapeHtml(info[closeIndex].text||"nothing")}</div>`)
        if(canContinue){ const button=document.getElementById("continueBtn");button.textContent="Continue · review later →";button.classList.add("show");scheduleLessonReview(activeTrackId,chapterIndex) }
        return
      }
      pronunciationAttempts++
      const canContinue = pronunciationAttempts >= 2
      showFeedback("error",canContinue?"Review and decide":"Not matched yet",`${canContinue?"Compare your recording with the slow example. You can retry or continue and review this word later.":"Play the slow example, then pronounce each syllable clearly."}<div class="recognized">Target: ${chapters[chapterIndex].word} · Heard as: ${escapeHtml(info[0]?.text||"nothing")}</div>`)
      if(canContinue){ const button=document.getElementById("continueBtn");button.textContent="Continue · review later →";button.classList.add("show");scheduleLessonReview(activeTrackId,chapterIndex) }
    }

    function showFeedback(kind,title,message){
      const box = document.getElementById("feedback"); if(!box) return
      box.className = `feedback ${kind}`; box.innerHTML = `<strong>${title}</strong>${message}`
    }
    function escapeHtml(value){ const div=document.createElement("div"); div.textContent=value; return div.innerHTML }

    function allLessonRecords(){
      return storyTracks.flatMap(track=>track.lessons.map((lesson,index)=>({lesson,key:`${track.id}-${index}`,trackId:track.id,index})))
    }

    function scheduleLessonReview(trackId,index){
      const key=`${trackId}-${index}`
      const old=reviewSchedule[key]||{strength:0}
      reviewSchedule[key]={...old,strength:Number(old.strength||0),dueAt:Date.now()+86400000}
      localStorage.setItem("linguaReviewSchedule",JSON.stringify(reviewSchedule))
    }

    function getDueReviewItems(){
      const records=allLessonRecords()
      return records.filter(record=>reviewSchedule[record.key]?.dueAt<=Date.now())
    }

    const levelRewards=[0,5,5,5,10]
    function addReviewXp(amount){
      localStorage.setItem("linguaReviewXp",String(Number(localStorage.getItem("linguaReviewXp")||0)+amount))
    }
    function updateReviewStrength(key,correct){
      const card=reviewSchedule[key]||{strength:0,dueAt:0,reviews:0,correct:0,lastReviewedAt:0}
      if(!card.levelsEarned||!card.levelsEarned.length) card.levelsEarned=Array.from({length:card.strength||0},(_,index)=>index+1)
      card.reviews=(card.reviews||0)+1
      card.lastReviewedAt=Date.now()
      if(correct){
        card.correct=(card.correct||0)+1
        const oldStrength=card.strength
        card.strength=Math.min(oldStrength+1,4)
        for(let level=oldStrength+1;level<=card.strength;level++){
          if(!card.levelsEarned.includes(level)){card.levelsEarned.push(level);addReviewXp(levelRewards[level]||0)}
        }
      }else{card.strength=0}
      const days=[1,3,7,14,30][card.strength]
      card.dueAt=Date.now()+days*86400000
      reviewSchedule[key]=card
      localStorage.setItem("linguaReviewSchedule",JSON.stringify(reviewSchedule))
    }

    function addReviewCorrect(){
      localStorage.setItem("linguaReviewCorrect",String(Number(localStorage.getItem("linguaReviewCorrect")||0)+1))
    }

    function startReview(sourceLessons,isDaily=false,returnTo=isDaily?"home":"track"){
      cleanupAudio()
      const records=allLessonRecords()
      reviewItems=sourceLessons.map(lesson=>{const record=records.find(item=>item.lesson===lesson)||records.find(item=>item.lesson.word===lesson.word);return record?{...record,requeued:false,missed:false}:null}).filter(Boolean)
      reviewIndex=0;reviewScore=0;reviewMistakes=0;reviewFirstTry=true;reviewIsDaily=!!isDaily;reviewReturn=returnTo
      document.getElementById("homeBtn").style.display="inline-block"
      saveReviewSession()
      renderReviewQuestion(isDaily)
    }

    function renderReviewQuestion(isDaily=false){
      if(reviewIndex>=reviewItems.length) return finishReview(isDaily)
      const item=reviewItems[reviewIndex]
      const pool=[...new Set(allLessonRecords().map(record=>record.lesson.meaning).filter(value=>value!==item.lesson.meaning))]
      const choices=[item.lesson.meaning,...pool.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)
      document.getElementById("headerProgress").style.display="block"
      document.getElementById("progressText").textContent=`Review ${reviewIndex+1} of ${reviewItems.length}`
      document.getElementById("progressBar").style.width=`${((reviewIndex+1)/reviewItems.length)*100}%`
      document.getElementById("app").innerHTML=`<button class="section-back" id="leaveReview">← Leave review</button><section class="comic-library-head"><p class="eyebrow">${isDaily?"Daily Review":"Level Checkpoint"}</p><h1>What does this word mean?</h1></section><div class="word-card" style="max-width:560px;margin:auto"><div class="hanzi" lang="zh-CN">${item.lesson.word}</div><div class="pinyin">${item.lesson.pinyin}</div><button class="btn speak" id="reviewSpeak" style="margin:14px auto">🔊 Hear it</button><div class="actions" id="reviewChoices">${choices.map(choice=>`<button class="btn playback review-choice" data-answer="${escapeHtml(choice)}">${escapeHtml(choice)}</button>`).join("")}</div><div class="feedback" id="feedback" role="status" aria-live="polite"><strong>Choose an answer</strong>Words you miss will return again before the review ends.</div></div>`
      document.getElementById("leaveReview").addEventListener("click",()=>{clearReviewSession();renderHome()})
      document.getElementById("reviewSpeak").addEventListener("click",()=>speakText(item.lesson.word))
      document.querySelectorAll(".review-choice").forEach(button=>button.addEventListener("click",()=>answerReview(button,item,isDaily)))
      focusHeading()
    }

    function answerReview(button,item,isDaily){
      if(button.dataset.answer===item.lesson.meaning){
        if(reviewFirstTry&&!item.requeued){ reviewScore++; addReviewCorrect() }
        updateReviewStrength(item.key,true)
        showFeedback("success","Correct!",`${item.lesson.word} means “${item.lesson.meaning}.”`)
        reviewIndex++;reviewFirstTry=true
        saveReviewSession()
        setTimeout(()=>renderReviewQuestion(isDaily),550)
      }else{
        reviewMistakes++;reviewFirstTry=false;item.missed=true
        updateReviewStrength(item.key,false)
        button.disabled=true
        showFeedback("error","Not quite — try again",`Listen once more and use the pinyin clue. This word will return later in the review.`)
        if(!item.requeued&&!reviewItems.some((queued,index)=>index>reviewIndex&&queued.key===item.key)) reviewItems.push({...item,requeued:true,missed:false})
        saveReviewSession()
      }
    }

    function finishReview(isDaily){
      clearReviewSession()
      addCoins(10)
      document.getElementById("headerProgress").style.display="none"
      document.getElementById("app").innerHTML=`<div class="complete"><div class="seal">${reviewMistakes?"🌱":"🏆"}</div><p class="eyebrow">Review complete</p><h2>${reviewMistakes?"Mistakes make memories stronger":"Perfect review!"}</h2><p>You corrected every word${reviewMistakes?` and practiced ${reviewMistakes} extra time${reviewMistakes===1?"":"s"}`:" on the first try"}.<br>These words will return later for spaced practice.</p><button class="btn restart" id="reviewDone">${reviewReturn==="lab"?"Back to Vocabulary Lab":reviewReturn==="home"?"Back Home":"Back to this track"}</button></div>`
      document.getElementById("reviewDone").addEventListener("click",reviewReturn==="lab"?renderVocabularyLab:reviewReturn==="home"?renderHome:renderTrack)
      focusHeading()
    }

    function saveLessonState(){
      localStorage.setItem("linguaLessonPhase",lessonPhase)
      localStorage.setItem("linguaBeatIndex",String(beatIndex))
    }
    function saveReviewSession(){
      localStorage.setItem("linguaReviewSession",JSON.stringify({
        items:reviewItems.map(item=>({key:item.key,requeued:!!item.requeued,missed:!!item.missed})),
        index:reviewIndex,score:reviewScore,mistakes:reviewMistakes,firstTry:reviewFirstTry,isDaily:reviewIsDaily,returnTo:reviewReturn
      }))
    }
    function clearReviewSession(){ localStorage.removeItem("linguaReviewSession") }
    function restoreReviewSession(){
      if(!reviewSession || !Array.isArray(reviewSession.items)) return false
      const records=allLessonRecords()
      const items=reviewSession.items.map(saved=>{const record=records.find(r=>r.key===saved.key);return record?{...record,requeued:!!saved.requeued,missed:!!saved.missed}:null}).filter(Boolean)
      if(!items.length) return false
      reviewItems=items
      reviewIndex=Math.min(Number(reviewSession.index||0),items.length)
      reviewScore=Number(reviewSession.score||0)
      reviewMistakes=Number(reviewSession.mistakes||0)
      reviewFirstTry=!!reviewSession.firstTry
      reviewIsDaily=!!reviewSession.isDaily
      reviewReturn=["home","lab","track"].includes(reviewSession.returnTo)?reviewSession.returnTo:(reviewIsDaily?"home":"track")
      return true
    }

    function nextChapter(){
      cleanupAudio()
      completedMissions = Math.max(completedMissions,chapterIndex + 1)
      trackProgress[activeTrackId]=completedMissions
      localStorage.setItem("linguaTrackProgress",JSON.stringify(trackProgress))
      addCoins(20)
      if(activeTrackId==="mystery") localStorage.setItem("linguaCompleted",completedMissions)
      scheduleLessonReview(activeTrackId,chapterIndex)
      if(chapterIndex < chapters.length - 1){
        chapterIndex++; lessonPhase="story"; beatIndex=0; pronunciationAttempts=0
        localStorage.setItem("linguaChapter",chapterIndex)
        saveLessonState()
        render(); window.scrollTo({top:0,behavior:"smooth"})
      } else startReview(chapters)
    }
    function cleanupAudio(){
      recordingSession++
      if(recordingTimeout){clearTimeout(recordingTimeout);recordingTimeout=null}
      try{if(mediaRecorder?.state === "recording") mediaRecorder.stop()}catch(error){}
      try{recognition?.abort()}catch(error){}
      try{sentenceRecognition?.abort()}catch(error){}
      sentenceRecognition=null
      mediaStream?.getTracks().forEach(track=>track.stop())
      mediaStream=null; mediaRecorder=null; recognition=null
      if(recordingUrl){URL.revokeObjectURL(recordingUrl);recordingUrl=""}
      if("speechSynthesis" in window) speechSynthesis.cancel()
    }
    function showCompletion(){
      localStorage.removeItem("linguaChapter"); document.getElementById("progressText").textContent="Story complete"; document.getElementById("progressBar").style.width="100%"
      document.getElementById("app").innerHTML=`<div class="complete"><div class="seal">🏮</div><p class="eyebrow">All missions complete</p><h2>You unlocked the mystery!</h2><p>You learned six Chinese words across two story levels.<br>Your next adventure is waiting at Cloud Castle.</p><button class="btn restart" id="restartBtn">Back to my missions</button></div>`
      document.getElementById("restartBtn").addEventListener("click",renderHome)
    }

    window.addEventListener("beforeunload",cleanupAudio)
    document.getElementById("homeBtn").addEventListener("click",()=>{clearReviewSession();renderHome()})
    buildCharPinyin()
    applyTheme(localStorage.getItem("linguaTheme")||"")
    updateStreak()
    if(restoreReviewSession()){
      document.getElementById("homeBtn").style.display="inline-block"
      renderReviewQuestion(reviewIsDaily)
    }else{
      renderHome()
      if(!localStorage.getItem("linguaTutorialSeen")) showTutorial()
    }
  </script>
</body>
